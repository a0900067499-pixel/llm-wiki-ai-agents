<svg viewBox="0 0 880 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LLM Wiki 到簡報的 graph 流程圖" style="width:100%;height:auto;font-family:Noto Sans TC,sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g><rect x="40" y="20" width="300" height="56" rx="6" fill="#fff" stroke="#4A4DB8" stroke-width="2"/><text x="54" y="43" font-size="15" font-weight="700" fill="#4A4DB8">N0 取得資料</text><text x="54" y="64" font-size="12.5" fill="#5E6E7D">WebSearch / WebFetch 找 6 篇</text></g><g><rect x="460" y="20" width="300" height="56" rx="6" fill="#fff" stroke="#C27C0E" stroke-width="2"/><text x="474" y="43" font-size="15" font-weight="700" fill="#C27C0E">N1 討論與確認（人）</text><text x="474" y="64" font-size="12.5" fill="#5E6E7D">重點、矛盾、結構給使用者確認</text></g><g><rect x="40" y="110" width="300" height="56" rx="6" fill="#fff" stroke="#4A4DB8" stroke-width="2"/><text x="54" y="133" font-size="15" font-weight="700" fill="#4A4DB8">N2 Ingest</text><text x="54" y="154" font-size="12.5" fill="#5E6E7D">擷取筆記寫入 raw/S1–S6（不可改）</text></g><g><rect x="40" y="200" width="300" height="56" rx="6" fill="#fff" stroke="#4A4DB8" stroke-width="2"/><text x="54" y="223" font-size="15" font-weight="700" fill="#4A4DB8">N3 編譯 Wiki</text><text x="54" y="244" font-size="12.5" fill="#5E6E7D">概念頁＋來源頁，每條事實標 [Sx]</text></g><g><rect x="460" y="200" width="300" height="56" rx="6" fill="#fff" stroke="#0E7A70" stroke-width="2"/><text x="474" y="223" font-size="15" font-weight="700" fill="#0E7A70">N4 Wiki lint</text><text x="474" y="244" font-size="12.5" fill="#5E6E7D">L1–L6：來源、數字、連結、矛盾</text></g><g><rect x="40" y="290" width="300" height="56" rx="6" fill="#fff" stroke="#4A4DB8" stroke-width="2"/><text x="54" y="313" font-size="15" font-weight="700" fill="#4A4DB8">N5 查詢 Wiki → 大綱</text><text x="54" y="334" font-size="12.5" fill="#5E6E7D">只讀 wiki/，每張標對應頁</text></g><g><rect x="460" y="290" width="300" height="56" rx="6" fill="#fff" stroke="#0E7A70" stroke-width="2"/><text x="474" y="313" font-size="15" font-weight="700" fill="#0E7A70">N6 大綱檢查</text><text x="474" y="334" font-size="12.5" fill="#5E6E7D">O1–O3：頁存在、覆蓋率、教學結構</text></g><g><rect x="40" y="380" width="300" height="56" rx="6" fill="#fff" stroke="#4A4DB8" stroke-width="2"/><text x="54" y="403" font-size="15" font-weight="700" fill="#4A4DB8">N7 逐張生成投影片</text><text x="54" y="424" font-size="12.5" fill="#5E6E7D">HTML，data-wiki 標對應頁</text></g><g><rect x="460" y="380" width="300" height="56" rx="6" fill="#fff" stroke="#0E7A70" stroke-width="2"/><text x="474" y="403" font-size="15" font-weight="700" fill="#0E7A70">N8a 內容檢查（逐張）</text><text x="474" y="424" font-size="12.5" fill="#5E6E7D">C1–C5：對應、數字、術語、示意</text></g><g><rect x="460" y="470" width="300" height="56" rx="6" fill="#fff" stroke="#0E7A70" stroke-width="2"/><text x="474" y="493" font-size="15" font-weight="700" fill="#0E7A70">N8b 視覺檢查（整份）</text><text x="474" y="514" font-size="12.5" fill="#5E6E7D">V1 超出版面、V2 按鈕被蓋住</text></g><g><rect x="40" y="560" width="300" height="56" rx="6" fill="#fff" stroke="#4A4DB8" stroke-width="2"/><text x="54" y="583" font-size="15" font-weight="700" fill="#4A4DB8">N9 發布</text><text x="54" y="604" font-size="12.5" fill="#5E6E7D">GitHub Pages</text></g><path d="M340 40 H456" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="390" y="34" font-size="12" fill="#1C2B3A">提案</text><path d="M460 62 H344" fill="none" stroke="#C27C0E" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="390" y="76" font-size="12" fill="#C27C0E">換資料</text><path d="M610.0 76 V138 H344" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="618.0" y="120" font-size="12" fill="#1C2B3A">同意</text><path d="M190.0 166 V196" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><path d="M340 220 H456" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><path d="M460 242 H344" fill="none" stroke="#0E7A70" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="380" y="256" font-size="12" fill="#0E7A70">失敗→修正</text><path d="M760 228 H780 V48 H764" fill="none" stroke="#C27C0E" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="784" y="140" font-size="12" fill="#C27C0E">矛盾→問人</text><path d="M610.0 256 V270 H190.0 V286" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="618.0" y="268" font-size="12" fill="#1C2B3A">通過</text><path d="M340 310 H456" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><path d="M460 332 H344" fill="none" stroke="#0E7A70" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="374" y="346" font-size="12" fill="#0E7A70">失敗→改大綱</text><path d="M610.0 346 V360 H190.0 V376" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="618.0" y="358" font-size="12" fill="#1C2B3A">通過</text><path d="M340 400 H456" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><path d="M460 422 H344" fill="none" stroke="#0E7A70" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="360" y="436" font-size="12" fill="#0E7A70">失敗→重生成這張</text><path d="M760 400 H800 V248 H764" fill="none" stroke="#4A4DB8" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="804" y="310" font-size="12" fill="#4A4DB8">wiki 缺資料</text><text x="804" y="326" font-size="12" fill="#4A4DB8">→ 回 Wiki 階段補</text><path d="M610.0 436 V466" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="618.0" y="454" font-size="12" fill="#1C2B3A">全部通過</text><path d="M460 498 H190.0 V440" fill="none" stroke="#0E7A70" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="198.0" y="492" font-size="12" fill="#0E7A70">版面錯→改</text><path d="M610.0 526 V588 H344" fill="none" stroke="#1C2B3A" stroke-width="1.6" marker-end="url(#ar)"/><text x="618.0" y="580" font-size="12" fill="#1C2B3A">通過</text><g font-size="12.5"><rect x="40" y="640" width="14" height="14" fill="#fff" stroke="#4A4DB8" stroke-width="2"/><text x="60" y="652" fill="#1C2B3A">LLM 生成節點</text><rect x="170" y="640" width="14" height="14" fill="#fff" stroke="#0E7A70" stroke-width="2"/><text x="190" y="652" fill="#1C2B3A">程式檢查節點（pipeline/*.py）</text><rect x="400" y="640" width="14" height="14" fill="#fff" stroke="#C27C0E" stroke-width="2"/><text x="420" y="652" fill="#1C2B3A">人工關卡</text><text x="510" y="652" fill="#5E6E7D">虛線＝回頭重做的迴圈</text></g></svg>